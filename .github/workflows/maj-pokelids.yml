name: Mise à jour Poké Lids (hebdomadaire)

on:
  schedule:
    # Tous les lundis à 10:00 heure de Paris.
    # 09:00 UTC = 10:00 Paris en hiver (11:00 en été).
    - cron: '0 9 * * 1'
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5h, marge sous la limite GitHub de 6h
    permissions:
      contents: write      # nécessaire pour commit + push via GITHUB_TOKEN

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour éviter les problèmes de push

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow tqdm

      - name: Lancer 01-crawl_url.py
        run: |
          # Affiche où on est et ce qu'il y a dans le dossier
          pwd
          ls -la
          
          # Lance le script avec le chemin complet
          # Le script va s'exécuter en se basant sur son propre dossier (BASE_DIR)
          python 01-Maj-pokelids/01-crawl_url.py --workers 8

      # Diagnostic : liste les artefacts produits (utile en cas d'échec)
      - name: Résumé des artefacts
        if: always()
        run: |
          echo "=== Fichiers produits ==="
          ls -la 01-Maj-pokelids/pokelid.kml 01-Maj-pokelids/pokelid.json 2>/dev/null || echo "KML/JSON absents"
          echo "=== Nombre de WebP ==="
          ls 01-Maj-pokelids/images_webp/icon-ci-*.webp 2>/dev/null | wc -l || true
          echo "=== Cache ==="
          ls -la 01-Maj-pokelids/.cache/ 2>/dev/null || echo "Pas de cache"

      - name: Commit et push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Vérifie s'il y a des changements avant de committer (évite un commit vide)
          if git diff --staged --quiet; then
            echo "Aucune modification détectée, pas de commit."
          else
            git commit -m "Maj automatique Poké Lids ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
