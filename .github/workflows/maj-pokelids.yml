name: Mise à jour Poké Lids (hebdomadaire)

on:
  schedule:
    # Tous les lundis à 10:00 heure de Paris (UTC+1 en hiver, UTC+2 en été).
    # 09:00 UTC = 10:00 Paris en hiver (11:00 en été).
    - cron: '0 9 * * 1'
  workflow_dispatch:   # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  maj:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nécessaire pour commit + push via GITHUB_TOKEN

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour éviter les problèmes de push

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow tqdm

      - name: Lancer 01-crawl_url.py
        run: |
          cd 01-Maj-pokelids
          python 01-crawl_url.py

      - name: Commit et push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Vérifie s'il y a des changements avant de committer (évite un commit vide)
          if git diff --staged --quiet; then
            echo "Aucune modification détectée, pas de commit."
          else
            git commit -m "Maj automatique Poké Lids ($(date +'%Y-%m-%d %H:%M'))"
            git push
          fi
