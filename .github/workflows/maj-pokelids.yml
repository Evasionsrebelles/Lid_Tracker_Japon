name: Mise à jour Poké Lids (hebdomadaire)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip requests beautifulsoup4 pillow tqdm

      - name: Lancer 01-crawl_url.py
        run: python /home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids/01-crawl_url.py --workers 8

      - name: Résumé des artefacts
        if: always()
        run: ls -la /home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids/pokelid.kml /home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids/pokelid.json

      - name: Commit et push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucune modification."
          else
            git commit -m "Maj automatique Poké Lids"
            git push
          fi
