name: Mise à jour Poké Lids (hebdomadaire)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow tqdm

      - name: Lancer 01-crawl_url.py
        run: |
          cd 01-Maj-pokelids && python 01-crawl_url.py --workers 8

      - name: Résumé des artefacts
        if: always()
        run: |
          echo "=== Fichiers produits ==="
          ls -la 01-Maj-pokelids/pokelid.kml 01-Maj-pokelids/pokelid.json 2>/dev/null || echo "KML/JSON absents"
          echo "=== Nombre de WebP ==="
          ls 01-Maj-pokelids/images_webp/icon-ci-*.webp 2>/dev/null | wc -l || true
          echo "=== Cache ==="
          ls -la 01-Maj-pokelids/.cache/ 2>/dev/null || echo "Pas de cache"

      - name: Commit et push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucune modification détectée, pas de commit."
          else
            git commit -m "Maj automatique Poké Lids ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
