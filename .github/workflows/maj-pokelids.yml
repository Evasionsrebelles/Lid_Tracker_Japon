name: Mise à jour Poké Lids (hebdomadaire)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip requests beautifulsoup4 pillow tqdm

      - name: Archiver les anciennes versions
        run: |
          DIR=/home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids
          ARCHIVE_DIR="$DIR/archives"
          mkdir -p "$ARCHIVE_DIR"

          TS=$(TZ=Europe/Paris date +"%d%m%y_%H%M")

          if [ -f "$DIR/pokelid.json" ]; then
            cp "$DIR/pokelid.json" "$ARCHIVE_DIR/pokelid_${TS}.json"
          fi
          if [ -f "$DIR/pokelid.kml" ]; then
            cp "$DIR/pokelid.kml" "$ARCHIVE_DIR/pokelid_${TS}.kml"
          fi

          for ext in json kml; do
            files=$(ls -t "$ARCHIVE_DIR"/pokelid_*."$ext" 2>/dev/null)
            count=$(echo "$files" | grep -c . || true)
            if [ "$count" -gt 5 ]; then
              echo "$files" | tail -n +6 | xargs rm -f
              echo "Suppression des .$ext au-delà des 5 plus récents."
            fi
          done

      - name: Lancer 01-crawl_url.py
        run: |
          python -u /home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids/01-crawl_url.py --workers 8 2>&1 | tee run.log

      - name: Résumé des artefacts
        if: always()
        run: ls -la /home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids/pokelid.kml /home/runner/work/Lid_Tracker_Japon/Lid_Tracker_Japon/01-Maj-pokelids/pokelid.json

      - name: Commit et push des modifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Aucune modification."
          else
            git commit -m "Maj automatique Poké Lids"
            git push
          fi

      - name: Préparer le résumé pour le mail
        if: always()
        run: grep -v 'OK | ' run.log | grep -v '⏳ Attente de' > run_summary.log

      - name: Envoyer les logs par mail
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Poké Lids - résultat du workflow (${{ job.status }})"
          to: ${{ secrets.MAIL_TO }}
          from: Poké Lids Bot
          body: file://run_summary.log
